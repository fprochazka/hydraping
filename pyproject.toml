[project]
name = "hydraping"
version = "0.1.0"
description = "Multi-protocol connection tester with live terminal UI - DNS, ICMP, TCP, TLS, and HTTP checks"
authors = [{ name = "Filip Procházka" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
keywords = [
    "ping",
    "network",
    "monitoring",
    "icmp",
    "dns",
    "tcp",
    "udp",
    "tls",
    "http",
    "terminal-ui",
    "latency",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "icmplib>=3.0.4,<4",
    "dnspython>=2.8.0,<3",
    "rich>=14.2.0,<15",
    "typer>=0.20.0,<0.21",
    "tomlkit>=0.15.2,<0.16",
]

[project.urls]
Homepage = "https://github.com/fprochazka/hydraping"
Repository = "https://github.com/fprochazka/hydraping"

[project.scripts]
hydraping = "hydraping.cli:app"

[project.optional-dependencies]
gui = [
    "dbus-fast>=5.2.0,<6",
    "pyside6-essentials>=6.11.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1,<3",
    "ruff>=0.14.10,<0.15",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "trustme>=1.2.1,<2",
    "pyside6-essentials>=6.11.3",
    "dbus-fast>=5.2.0,<6",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["hydraping"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["hydraping", "tests"]

[[tool.mypy.overrides]]
# icmplib ships no type information.
module = "icmplib"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
